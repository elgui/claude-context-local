[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csearch"
version = "0.1.0"
description = "Grep-like semantic code search CLI with MCP integration. 100% local embeddings using EmbeddingGemma, FAISS, and AST/tree-sitter chunking."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Farhan Ali Raza" }
]
maintainers = [
    { name = "Farhan Ali Raza" }
]
keywords = [
    "semantic-search",
    "code-search",
    "cli",
    "grep",
    "embeddings",
    "faiss",
    "mcp",
    "claude",
    "tree-sitter",
    "chunking",
    "python",
]
dependencies = [
    "click>=8.2.1",
    "faiss-cpu>=1.12.0",
    "fastmcp>=2.12.2",
    "huggingface-hub>=0.34.4",
    "mcp>=1.13.1",
    "rich>=14.1.0",
    "sentence-transformers>=5.1.0",
    "sqlitedict>=2.1.0",
    "tree-sitter>=0.20.0",
    "tree-sitter-c>=0.24.1",
    "tree-sitter-c-sharp>=0.23.1",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-markdown>=0.3.2",
    "tree-sitter-python>=0.23.6",
    "tree-sitter-rust>=0.24.0",
    "tree-sitter-svelte>=1.0.2",
    "tree-sitter-typescript>=0.23.2",
    "watchdog>=4.0.0",
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Environment :: Console",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
]

[project.scripts]
csearch = "cli.main:main"

[project.entry-points."mcp.servers"]
csearch = "mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/FarhanAliRaza/claude-context-local"
Repository = "https://github.com/FarhanAliRaza/claude-context-local"
Documentation = "https://github.com/FarhanAliRaza/claude-context-local#readme"
Issues = "https://github.com/FarhanAliRaza/claude-context-local/issues"

[tool.setuptools.packages.find]
include = ["cli*", "core*", "chunking*", "embeddings*", "search*", "merkle*", "mcp_server*"]
